name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar o APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk midia-indoor.apk

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: midia-indoor-apk
          path: midia-indoor.apk
          if-no-files-found: error

      - name: Publicar o Release com link direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Midia Indoor - ultima versao
          files: midia-indoor.apk
